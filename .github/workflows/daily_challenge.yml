name: Daily Python Challenge

on:
  schedule:
    - cron: '0 18 * * *' # Runs every day at 6:00 PM UTC
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automator
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }} # Optional: Use custom endpoint
          LLM_MODEL: ${{ vars.LLM_MODEL }}       # Optional: e.g. gemma2
        run: |
          # Set up Git identity for the commit
          git config user.name "GitHub Actions Runner"
          git config user.email "actions@github.com"
          
          # Generate the next day and push it
          python cli.py --next --push
